<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EOS Report — DC499</title>
<style>
  :root {
    --bg:#0d1117; --surface:#161b22; --surface2:#1c2231;
    --border:#253352; --border-light:#1e2d47;
    --text:#f0f4f8; --text-muted:#a0aec0; --text-hint:#6b80a0;
    --amber:#f59e0b; --amber-dim:rgba(245,158,11,0.08);
    --green:#10b981; --green-dim:rgba(16,185,129,0.09);
    --red:#f87171; --yellow:#fbbf24; --yellow-dim:rgba(251,191,36,0.09);
    --mono:'Consolas','Courier New',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;padding:0 0 56px;}

  /* top bar */
  .top-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;}
  .top-bar-title{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--amber);}
  .top-bar-sub{font-size:11px;color:var(--text-hint);margin-left:3px;font-weight:400;text-transform:none;letter-spacing:0;}
  .spacer{flex:1;}
  .btn{padding:5px 14px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;cursor:pointer;transition:all .15s;}
  .btn:hover{border-color:var(--amber);color:var(--amber);}
  .status-chip{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-hint);padding:3px 10px;border:1px solid var(--border);border-radius:20px;}
  .status-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--text-hint);flex-shrink:0;transition:background .2s;}
  .status-chip .dot.sos{background:var(--yellow);}
  .status-chip .dot.eos{background:var(--green);}

  /* layout */
  .container{max-width:900px;margin:0 auto;padding:20px 16px;}

  /* masthead */
  .masthead{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  .masthead-eyebrow{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-hint);margin-bottom:5px;}
  .masthead-date{font-size:26px;font-weight:300;color:var(--text);letter-spacing:-.3px;font-family:var(--mono);}
  .masthead-shift{display:inline-block;margin-top:7px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--amber);border:1px solid var(--amber);border-radius:3px;padding:2px 8px;}
  .masthead-snaps{display:flex;gap:0;align-items:stretch;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  .snap{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 20px;}
  .snap:first-child{border-right:1px solid var(--border);}
  .snap-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-hint);}
  .snap-time{font-size:17px;font-family:var(--mono);font-weight:500;color:var(--text);}
  .snap-time.missing{font-size:12px;color:var(--text-hint);font-style:italic;font-family:'Segoe UI',system-ui,sans-serif;}
  .recon-badge{display:inline-block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;background:rgba(251,191,36,0.12);color:var(--yellow);border:1px solid rgba(251,191,36,0.3);border-radius:3px;padding:2px 7px;margin-left:8px;vertical-align:middle;}

  /* section block — uniform card for every dept */
  .section-block{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:14px;}
  .section-head{background:var(--surface2);border-left:3px solid var(--amber);border-bottom:1px solid var(--border);padding:8px 14px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text);}

  /* dept table — consistent 4-col structure */
  .dept-table{width:100%;border-collapse:collapse;}
  .dept-table thead th{padding:6px 14px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-hint);background:var(--surface2);border-bottom:1px solid var(--border);text-align:right;}
  .dept-table thead th.col-field{text-align:left;width:42%;}
  .dept-table thead th.col-sos{width:16%;}
  .dept-table thead th.col-eos{width:20%;}
  .dept-table thead th.col-chg{width:14%;}
  .dept-table tbody tr{border-bottom:1px solid var(--border-light);}
  .dept-table tbody tr:last-child:not(.notes-row){border-bottom:none;}
  .dept-table tbody tr.notes-row{border-bottom:none;}
  .dept-table tbody tr:hover:not(.notes-row){background:rgba(255,255,255,0.02);}

  /* table cells */
  .dept-table td{padding:10px 14px;vertical-align:middle;}
  td.field-name{font-size:13px;font-weight:500;color:var(--text);}
  td.val-sos{text-align:right;font-family:var(--mono);font-size:15px;font-weight:400;color:var(--text-muted);}
  td.val-sos.missing{font-size:11px;color:var(--text-hint);font-family:'Segoe UI',system-ui,sans-serif;font-style:italic;}
  td.val-eos{text-align:right;font-family:var(--mono);font-size:20px;font-weight:700;color:var(--text);}
  td.val-chg{text-align:right;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--text-hint);}
  td.val-chg.up{color:var(--green);}
  td.val-chg.dn{color:var(--red);}

  /* EOS value accent states */
  td.val-eos.is-accent{color:var(--amber);}
  td.val-eos.is-warn{color:var(--yellow);}
  td.val-eos.is-good{color:var(--green);}

  /* manual entry cell */
  td.manual-cell{vertical-align:middle;}
  .manual-cell input{width:100%;background:transparent;border:none;border-bottom:1px dashed var(--border);color:var(--text);font-size:17px;font-weight:700;font-family:var(--mono);padding:2px 0 3px;outline:none;}
  .manual-cell input:focus{border-bottom-color:var(--amber);border-bottom-style:solid;}
  .manual-cell input::placeholder{color:var(--text-hint);font-size:12px;font-weight:400;font-family:'Segoe UI',system-ui,sans-serif;}

  /* notes row */
  tr.notes-row td{padding:8px 14px;border-top:1px solid var(--border-light);}
  .notes-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-hint);margin-bottom:4px;}
  tr.notes-row textarea{width:100%;background:transparent;border:none;color:var(--text-muted);font-size:12px;font-family:'Segoe UI',system-ui,sans-serif;resize:vertical;min-height:34px;outline:none;line-height:1.5;}
  tr.notes-row textarea::placeholder{color:var(--text-hint);}

  /* waves total row */
  .dept-table tbody tr.wave-total{background:var(--amber-dim);border-top:1px solid rgba(245,158,11,0.2);}
  .dept-table tbody tr.wave-total td.field-name{font-weight:700;color:var(--amber);}
  .dept-table tbody tr.wave-total td.val-eos{color:var(--amber);}

  /* info banner */
  .info-banner{background:var(--amber-dim);border:1px solid rgba(245,158,11,0.25);border-radius:6px;padding:10px 14px;font-size:12px;color:var(--text-muted);margin-bottom:16px;line-height:1.5;}

  /* disclaimer */
  .disclaimer{font-size:10px;color:var(--text-hint);text-align:center;margin-top:28px;line-height:1.6;}

  /* print */
  @media print {
    body{background:#fff;color:#111;padding:0;}
    .top-bar{display:none;}
    .section-block{border-color:#ccc;background:#fff;}
    .section-head{background:#f5f5f5;border-left-color:#f59e0b;color:#111;}
    .dept-table thead{background:#f5f5f5;}
    .dept-table thead th{color:#666;background:#f5f5f5;}
    td.field-name{color:#111;}
    td.val-sos{color:#999;}
    td.val-eos{color:#111;}
    td.val-eos.is-accent{color:#b45309;}
    td.val-eos.is-warn{color:#b45309;}
    td.val-eos.is-good{color:#065f46;}
    .manual-cell input{color:#111;border-bottom-color:#aaa;}
    tr.notes-row td{border-top-color:#ddd;}
    tr.notes-row textarea{color:#444;}
    .masthead{border-color:#ddd;}
    .masthead-date{color:#111;}
    .masthead-snaps{border-color:#ddd;}
    .snap:first-child{border-right-color:#ddd;}
    .snap-time{color:#111;}
    .dept-table tbody tr.wave-total td.field-name{color:#b45309;}
    .dept-table tbody tr.wave-total td.val-eos{color:#b45309;}
    .disclaimer{color:#aaa;}
  }

  @media(max-width:600px){
    .dept-table thead th.col-sos,.dept-table td.val-sos{display:none;}
    .dept-table thead th.col-field{width:52%;}
  }

  /* export modal */
  .export-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center;}
  .export-modal.open{display:flex;}
  .export-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;width:min(680px,95vw);max-height:85vh;display:flex;flex-direction:column;overflow:hidden;}
  .export-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .export-header-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--amber);}
  .export-header-hint{font-size:11px;color:var(--text-hint);}
  .export-close{background:none;border:none;color:var(--text-hint);font-size:18px;cursor:pointer;line-height:1;padding:2px 6px;}
  .export-close:hover{color:var(--text);}
  .export-body{padding:16px 18px;overflow-y:auto;flex:1;}
  .export-preview{background:#fff;border-radius:4px;padding:16px;font-family:Arial,sans-serif;font-size:12px;line-height:1.4;color:#111;}
  .export-footer{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;flex-shrink:0;}
</style>
</head>
<body>

<div class="top-bar">
  <span class="top-bar-title">EOS Report<span class="top-bar-sub"> · DC499</span></span>
  <div class="spacer"></div>
  <div class="status-chip">
    <span class="dot" id="status-dot"></span>
    <span id="status-label">Loading...</span>
  </div>
  <button class="btn" onclick="exportEmail()">Export for Email</button>
  <button class="btn" onclick="window.print()">Print / PDF</button>
</div>

<div class="container" id="main-container">
  <div style="text-align:center;padding:60px;color:var(--text-hint);font-size:13px;">Loading...</div>
</div>

<div class="export-modal" id="export-modal">
  <div class="export-box">
    <div class="export-header">
      <span class="export-header-title">Export for Email</span>
      <span class="export-header-hint">Copy the content below and paste into your email body</span>
      <button class="export-close" onclick="closeExport()">✕</button>
    </div>
    <div class="export-body">
      <div class="export-preview" id="export-preview"></div>
    </div>
    <div class="export-footer">
      <button class="btn" onclick="copyExport()">Copy to Clipboard</button>
      <button class="btn" onclick="closeExport()">Close</button>
    </div>
  </div>
</div>

<script>
var DATA_URL    = 'eos_report.json';
var SOS_URL     = 'eos_sos_snapshot.json';
var BACKLOG_URL = 'backlog_live.json';
var sos = null, eos = null;

function fmt(v) {
  if (v === null || v === undefined) return '—';
  return Number(v).toLocaleString();
}
function fmtInterval(v) {
  if (v === null || v === undefined) return '—';
  return Number(v).toFixed(1) + ' min';
}
function chgText(s, e) {
  if (s == null || e == null) return '—';
  const d = e - s;
  if (d === 0) return '±0';
  return (d > 0 ? '+' : '') + d.toLocaleString();
}
function chgClass(s, e) {
  if (s == null || e == null) return '';
  return (e - s) > 0 ? 'up' : (e - s) < 0 ? 'dn' : '';
}

// ── table row builders ────────────────────────────────────────────────────────
function tRow(label, sv, ev, evClass, svUnavailable) {
  const sosTxt  = sv != null ? fmt(sv) : null;
  const sosCls  = sv == null ? 'missing' : '';
  const sosDisp = svUnavailable ? 'n/a' : (sosTxt || 'no SOS');
  return `
  <tr>
    <td class="field-name">${label}</td>
    <td class="val-sos ${sosCls}">${sosDisp}</td>
    <td class="val-eos ${evClass||''}">${fmt(ev)}</td>
    <td class="val-chg ${chgClass(sv,ev)}">${svUnavailable ? '—' : chgText(sv,ev)}</td>
  </tr>`;
}

function tInterval(label, sv, ev) {
  const sosTxt = sv != null ? sv.toFixed(1) + ' min' : null;
  const eosTxt = ev != null ? ev.toFixed(1) + ' min' : '—';
  const sosCls = sv == null ? 'missing' : '';
  return `
  <tr>
    <td class="field-name">${label}</td>
    <td class="val-sos ${sosCls}">${sosTxt || 'no SOS'}</td>
    <td class="val-eos">${eosTxt}</td>
    <td class="val-chg">—</td>
  </tr>`;
}

function tManual(label, id, placeholder) {
  return `
  <tr>
    <td class="field-name">${label}</td>
    <td class="val-sos missing">—</td>
    <td class="manual-cell" colspan="2">
      <input id="manual-${id}" type="text" placeholder="${placeholder||'Enter value'}" autocomplete="off">
    </td>
  </tr>`;
}

function tNotes(section) {
  const id = section.replace(/\s/g,'-').toLowerCase();
  return `
  <tr class="notes-row">
    <td colspan="4">
      <div class="notes-label">Notes</div>
      <textarea id="note-${id}" placeholder="Add notes for ${section}..."></textarea>
    </td>
  </tr>`;
}

function sectionBlock(title, rows) {
  return `
  <div class="section-block">
    <div class="section-head">${title}</div>
    <table class="dept-table">
      <thead><tr>
        <th class="col-field"></th>
        <th class="col-sos">SOS</th>
        <th class="col-eos">EOS</th>
        <th class="col-chg">Change</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

// ── render ────────────────────────────────────────────────────────────────────
function render() {
  const container = document.getElementById('main-container');
  const s = sos, e = eos;
  const sosTime    = s ? s.captured_at : null;
  const eosTime    = e ? e.captured_at : null;
  const isRecon    = s?.reconstructed === true;
  const dateDisp   = fmtDate((e||s)?.date);
  // Fields that cannot be reconstructed from history
  const sosUnavail = isRecon;

  let html = `
  <div class="masthead">
    <div>
      <div class="masthead-eyebrow">End of Shift Report &nbsp;·&nbsp; DC499 Nordstrom</div>
      <div class="masthead-date">${dateDisp || '—'}</div>
      <span class="masthead-shift">B Shift</span>
      ${isRecon ? `<span class="recon-badge">SOS Reconstructed</span>` : ''}
    </div>
    <div class="masthead-snaps">
      <div class="snap">
        <div class="snap-label">SOS${isRecon?' (est.)':''}</div>
        <div class="snap-time ${sosTime?'':'missing'}">${sosTime||'Not captured'}</div>
      </div>
      <div class="snap">
        <div class="snap-label">EOS</div>
        <div class="snap-time ${eosTime?'':'missing'}">${eosTime||'Not captured'}</div>
      </div>
    </div>
  </div>`;

  if (!e && !s) {
    html += `<div class="info-banner">No data loaded — run <strong>eos.bat → Option 1</strong> at 2:10 PM to capture SOS, then <strong>Option 2</strong> at shift end. Fill in manual fields below.</div>`;
  }

  const hospCls = (e?.hospital_orders ?? s?.hospital_orders ?? 0) > 0 ? 'is-warn' : '';
  const u = sosUnavail; // shorthand — true when SOS was reconstructed and field is current-state only

  // ORDERS & UNITS
  html += sectionBlock('Orders &amp; Units',
    tRow('Total Orders',       s?.open_orders     ?? null, e?.open_orders     ?? null, 'is-accent', u) +
    tRow('Total Units',        s?.open_units      ?? null, e?.open_units      ?? null, '',          u) +
    tRow('Hospital Orders',    s?.hospital_orders ?? null, e?.hospital_orders ?? null, hospCls,     u) +
    tManual('Batch Criteria Not Met', 'batch-criteria', 'e.g. 68')
  );

  // PICKING
  html += sectionBlock('Picking',
    tRow('Pick Tasks Open',      s?.pick_open ?? null, e?.pick_open ?? null, (e?.pick_open ?? 0)>0 ? 'is-warn' : 'is-good') +
    tRow('Pick Tasks Completed', s?.pick_done ?? null, e?.pick_done ?? null) +
    tNotes('Picking')
  );

  // SORTING
  html += sectionBlock('Sorting',
    tRow('Batches in Queue',     s?.batches_in_queue    ?? null, e?.batches_in_queue    ?? null, (e?.batches_in_queue ?? 0)>0 ? 'is-warn' : 'is-good') +
    tRow('Orders Not Released',  s?.orders_not_released ?? null, e?.orders_not_released ?? null) +
    tRow('Batches Cleared',      s?.batches_cleared     ?? null, e?.batches_cleared     ?? null) +
    tInterval('Avg Release Interval', s?.avg_release_interval ?? null, e?.avg_release_interval ?? null) +
    tNotes('Sorting')
  );

  // PACKING
  html += sectionBlock('Packing',
    tManual('Line Capacity',   'line-capacity',  'e.g. 6/8 stations') +
    tManual('Cross-Training',  'cross-training', 'e.g. 2 associates') +
    tRow('Packed Not Shipped', s?.packed_not_shipped ?? null, e?.packed_not_shipped ?? null, '', u) +
    tNotes('Packing')
  );

  // SHIPPING
  html += sectionBlock('Shipping',
    tManual('Status', 'shipping-status', 'e.g. All loaded virtually, Carrier delay...') +
    tRow('Loaded Virtually', s?.loaded_virtually ?? null, e?.loaded_virtually ?? null, 'is-good', u) +
    tNotes('Shipping')
  );

  // STOCK CONTROL
  html += sectionBlock('Stock Control',
    tRow('Replen Tasks Open',      s?.replen_open  ?? null, e?.replen_open  ?? null, (e?.replen_open  ?? 0)>0 ? 'is-warn' : 'is-good') +
    tRow('Replen Tasks Done',      s?.replen_done  ?? null, e?.replen_done  ?? null) +
    tRow('Putaway (FC Prep) Open', s?.putaway_open ?? null, e?.putaway_open ?? null, (e?.putaway_open ?? 0)>0 ? 'is-warn' : 'is-good') +
    tRow('Putaway Done',           s?.putaway_done ?? null, e?.putaway_done ?? null) +
    tNotes('Stock Control')
  );

  // WAVES RUN
  const waves    = (e||s)?.waves || [];
  const nonTotal = waves.filter(w => w.type !== 'Total' && (w.count||0) > 0);
  const totalRow = waves.find(w => w.type === 'Total');

  let waveRows = nonTotal.map(w =>
    `<tr>
      <td class="field-name">${w.type}</td>
      <td class="val-sos missing">—</td>
      <td class="val-eos is-accent">${w.count}</td>
      <td class="val-chg">—</td>
    </tr>`
  ).join('');

  if (totalRow) {
    waveRows += `<tr class="wave-total">
      <td class="field-name">Total</td>
      <td class="val-sos missing">—</td>
      <td class="val-eos">${totalRow.count||0}</td>
      <td class="val-chg">—</td>
    </tr>`;
  }

  const noWaveMsg = '<tr><td colspan="4" style="color:var(--text-hint);padding:14px;text-align:center;font-size:12px;">No wave data</td></tr>';

  html += `
  <div class="section-block">
    <div class="section-head">Waves Run</div>
    <table class="dept-table">
      <thead><tr>
        <th class="col-field"></th>
        <th class="col-sos">SOS</th>
        <th class="col-eos">EOS</th>
        <th class="col-chg"></th>
      </tr></thead>
      <tbody>${waveRows||noWaveMsg}</tbody>
    </table>
  </div>`;

  html += `<div class="disclaimer">Disclaimer: This tool measures throughput only and may not be used to evaluate, coach, or hold team members accountable on performance.</div>`;

  container.innerHTML = html;
}

function fmtDate(str) {
  if (!str) return null;
  try {
    const [y,m,d] = str.split('-');
    const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${mo[parseInt(m,10)-1]} ${parseInt(d,10)}, ${y}`;
  } catch { return str; }
}

async function backlogUnits(dateStr) {
  try {
    const r = await fetch(BACKLOG_URL + '?v=' + Date.now());
    if (!r.ok) return null;
    const data = await r.json();
    const day = (data.dates || []).find(d => d.date === dateStr);
    if (!day) return null;
    return (day.ready || 0) + (day.allocated || 0);
  } catch { return null; }
}

async function loadData() {
  const dot   = document.getElementById('status-dot');
  const label = document.getElementById('status-label');
  try {
    const r = await fetch(DATA_URL + '?v=' + Date.now());
    if (r.ok) {
      const data = await r.json();
      sos = data.sos; eos = data.eos;
      if (sos && sos.open_units == null) sos.open_units = await backlogUnits(sos.date);
      dot.className = 'dot eos';
      label.textContent = `EOS captured ${(data.generated||'').slice(11,16)}`;
      render(); return;
    }
  } catch {}
  try {
    const r = await fetch(SOS_URL + '?v=' + Date.now());
    if (r.ok) {
      const data = await r.json();
      sos = data; eos = null;
      if (sos.open_units == null) sos.open_units = await backlogUnits(sos.date);
      dot.className = 'dot sos';
      label.textContent = `SOS only — ${data.captured_at||''}`;
      render(); return;
    }
  } catch {}
  dot.className = 'dot';
  label.textContent = 'No data — manual entry';
  render();
}

// ── email export ─────────────────────────────────────────────────────────────
function exportEmail() {
  const s = sos, e = eos;
  const dateDisp = fmtDate((e||s)?.date) || '—';
  const sosTime  = s?.captured_at || '—';
  const eosTime  = e?.captured_at || '—';

  // manual field values from the DOM (filled in by supervisor)
  function manualVal(id) {
    const el = document.getElementById('manual-' + id);
    return el ? (el.value.trim() || '—') : '—';
  }
  function noteVal(section) {
    const id = 'note-' + section.replace(/\s/g,'-').toLowerCase();
    const el = document.getElementById(id);
    return el ? (el.value.trim() || '') : '';
  }

  const waves = (e||s)?.waves || [];
  const activeWaves = waves.filter(w => w.type !== 'Total' && (w.count||0) > 0);
  const totalWave   = waves.find(w => w.type === 'Total');

  // shared cell styles
  const th  = 'style="background:#1a1a2e;color:#f59e0b;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:7px 10px;text-align:left;border:1px solid #333;"';
  const thR = 'style="background:#1a1a2e;color:#f59e0b;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:7px 10px;text-align:right;border:1px solid #333;"';
  const td  = 'style="padding:6px 10px;border:1px solid #ddd;font-size:12px;color:#222;vertical-align:top;"';
  const tdR = 'style="padding:6px 10px;border:1px solid #ddd;font-size:12px;color:#222;text-align:right;vertical-align:top;"';
  const tdB = 'style="padding:6px 10px;border:1px solid #ddd;font-size:13px;font-weight:700;color:#111;text-align:right;vertical-align:top;"';
  const tdL = 'style="padding:6px 10px;border:1px solid #ddd;font-size:12px;color:#888;text-align:right;vertical-align:top;"';
  const sec = 'style="width:100%;border-collapse:collapse;margin-bottom:14px;"';

  function dataRow(label, sv, ev, highlight) {
    const evStyle = highlight
      ? 'style="padding:6px 10px;border:1px solid #ddd;font-size:13px;font-weight:700;text-align:right;color:' + highlight + ';vertical-align:top;"'
      : tdB;
    return `<tr>
      <td ${td}>${label}</td>
      <td ${tdL}>${sv != null ? fmt(sv) : '—'}</td>
      <td ${evStyle}>${ev != null ? fmt(ev) : '—'}</td>
    </tr>`;
  }
  function manualRow(label, id) {
    return `<tr><td ${td}>${label}</td><td ${tdL}>—</td><td ${tdB}>${manualVal(id)}</td></tr>`;
  }
  function intervalRow(label, sv, ev) {
    return `<tr>
      <td ${td}>${label}</td>
      <td ${tdL}>${sv != null ? sv.toFixed(1)+' min' : '—'}</td>
      <td ${tdB}>${ev != null ? ev.toFixed(1)+' min' : '—'}</td>
    </tr>`;
  }
  function sectionHeader(title) {
    return `<tr><th colspan="3" ${th}>${title}</th></tr>
    <tr><td ${td} style="padding:4px 10px;border:1px solid #ddd;font-size:10px;color:#888;">Field</td><td ${tdL} style="padding:4px 10px;border:1px solid #ddd;font-size:10px;color:#888;">SOS</td><td ${tdR} style="padding:4px 10px;border:1px solid #ddd;font-size:10px;color:#888;">EOS</td></tr>`;
  }
  function notesRow(section) {
    const txt = noteVal(section);
    if (!txt) return '';
    return `<tr><td colspan="3" ${td} style="padding:6px 10px;border:1px solid #ddd;font-size:11px;color:#555;">Notes: ${txt.replace(/\n/g,'  ')}</td></tr>`;
  }

  const hospColor = (e?.hospital_orders ?? s?.hospital_orders ?? 0) > 0 ? '#b45309' : '#059669';

  const html = `
<table style="width:100%;border-collapse:collapse;font-family:Arial,sans-serif;max-width:640px;">
  <tr>
    <td colspan="2" style="background:#1a1a2e;padding:14px 16px;border-radius:4px 4px 0 0;">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#f59e0b;margin-bottom:4px;">End of Shift Report &nbsp;·&nbsp; DC499 Nordstrom</div>
      <div style="font-size:20px;font-weight:300;color:#fff;">${dateDisp}</div>
      <div style="margin-top:8px;display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#f59e0b;border:1px solid #f59e0b;border-radius:3px;padding:2px 8px;">B Shift</div>
      &nbsp;
      <span style="font-size:11px;color:#aaa;">SOS: <strong style="color:#fbbf24;">${sosTime}</strong> &nbsp;·&nbsp; EOS: <strong style="color:#fff;">${eosTime}</strong></span>
    </td>
  </tr>
  <tr>
    <td style="padding:14px 0 0;vertical-align:top;width:50%;">

      <table ${sec}>
        ${sectionHeader('Orders &amp; Units')}
        ${dataRow('Total Orders', s?.open_orders, e?.open_orders)}
        ${dataRow('Total Units', s?.open_units, e?.open_units)}
        ${dataRow('Hospital Orders', s?.hospital_orders, e?.hospital_orders, hospColor)}
        ${manualRow('Batch Criteria Not Met', 'batch-criteria')}
      </table>

      <table ${sec}>
        ${sectionHeader('Picking')}
        ${dataRow('Pick Tasks Open', s?.pick_open, e?.pick_open, (e?.pick_open??0)>0?'#b45309':'#059669')}
        ${dataRow('Pick Tasks Done', s?.pick_done, e?.pick_done)}
        ${notesRow('Picking')}
      </table>

      <table ${sec}>
        ${sectionHeader('Packing')}
        ${manualRow('Line Capacity', 'line-capacity')}
        ${manualRow('Cross-Training', 'cross-training')}
        ${dataRow('Packed Not Shipped', s?.packed_not_shipped, e?.packed_not_shipped)}
        ${notesRow('Packing')}
      </table>

    </td>
    <td style="padding:14px 0 0 14px;vertical-align:top;width:50%;">

      <table ${sec}>
        ${sectionHeader('Sorting')}
        ${dataRow('Batches in Queue', s?.batches_in_queue, e?.batches_in_queue, (e?.batches_in_queue??0)>0?'#b45309':'#059669')}
        ${dataRow('Orders Not Released', s?.orders_not_released, e?.orders_not_released)}
        ${dataRow('Batches Cleared', s?.batches_cleared, e?.batches_cleared)}
        ${intervalRow('Avg Release Interval', s?.avg_release_interval??null, e?.avg_release_interval??null)}
        ${notesRow('Sorting')}
      </table>

      <table ${sec}>
        ${sectionHeader('Shipping')}
        ${manualRow('Status', 'shipping-status')}
        ${dataRow('Loaded Virtually', s?.loaded_virtually, e?.loaded_virtually, '#059669')}
        ${notesRow('Shipping')}
      </table>

      <table ${sec}>
        ${sectionHeader('Stock Control')}
        ${dataRow('Replen Tasks Open', s?.replen_open, e?.replen_open, (e?.replen_open??0)>0?'#b45309':'#059669')}
        ${dataRow('Replen Tasks Done', s?.replen_done, e?.replen_done)}
        ${dataRow('Putaway Open', s?.putaway_open, e?.putaway_open, (e?.putaway_open??0)>0?'#b45309':'#059669')}
        ${dataRow('Putaway Done', s?.putaway_done, e?.putaway_done)}
        ${notesRow('Stock Control')}
      </table>

    </td>
  </tr>
  <tr>
    <td colspan="2" style="padding-top:14px;">
      <table ${sec}>
        <tr><th colspan="2" ${th}>Waves Run</th></tr>
        ${activeWaves.map(w=>`<tr><td ${td}>${w.type}</td><td ${tdB}>${w.count}</td></tr>`).join('')}
        ${totalWave ? `<tr><td style="padding:6px 10px;border:1px solid #ddd;font-size:12px;font-weight:700;color:#b45309;">Total</td><td style="padding:6px 10px;border:1px solid #ddd;font-size:13px;font-weight:700;text-align:right;color:#b45309;">${totalWave.count}</td></tr>` : ''}
      </table>
    </td>
  </tr>
  <tr>
    <td colspan="2" style="padding:10px 0;font-size:9px;color:#aaa;text-align:center;">
      Disclaimer: This tool measures throughput only and may not be used to evaluate, coach, or hold team members accountable on performance.
    </td>
  </tr>
</table>`;

  document.getElementById('export-preview').innerHTML = html;
  document.getElementById('export-modal').classList.add('open');
}

function closeExport() {
  document.getElementById('export-modal').classList.remove('open');
}

function copyExport() {
  const preview = document.getElementById('export-preview');
  if (navigator.clipboard && window.ClipboardItem) {
    const blob = new Blob([preview.innerHTML], { type: 'text/html' });
    navigator.clipboard.write([new ClipboardItem({ 'text/html': blob })])
      .then(() => {
        const btn = event.target;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy to Clipboard', 2000);
      })
      .catch(() => fallbackCopy(preview));
  } else {
    fallbackCopy(preview);
  }
}

function fallbackCopy(el) {
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  document.execCommand('copy');
  sel.removeAllRanges();
  const btn = document.querySelector('.export-footer .btn');
  if (btn) { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy to Clipboard', 2000); }
}

loadData();
</script>
</body>
</html>
