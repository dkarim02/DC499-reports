<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCOUT — Menu v1.7</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1e1e1e; color: #f0f0ee;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 1.5rem;
    transition: background 0.2s, color 0.2s;
  }
  body.light   { background: #f5f5f3; color: #1a1a1a; }
  body.solid   { background: #13172b; color: #e4e8f4; }
  body.pastel  { background: #1a1c24; color: #d4d0e8; }

  /* Header */
  .header { text-align: center; margin-bottom: 1.5rem; }
  .header h1 { font-size: 22px; font-weight: 500; margin-bottom: 4px; }
  .header p { font-size: 13px; color: #888; }
  body.light .header p { color: #666; }
  body.solid  .header p { color: #8090b0; }
  body.pastel .header p { color: #8b8aaa; }

  /* Tabs */
  .tab-bar {
    display: flex; gap: 6px; margin-bottom: 1.25rem;
    background: #2a2a2a; border: 1.5px solid #3a3a3a;
    border-radius: 12px; padding: 4px;
  }
  body.light  .tab-bar { background: #f0f0ee; border-color: #ddd; }
  body.solid  .tab-bar { background: #1b2035; border-color: #2e3650; }
  body.pastel .tab-bar { background: #232631; border-color: #3c3f52; }
  .tab-btn {
    font-family: inherit; font-size: 12px; font-weight: 500;
    padding: 5px 20px; border: none; border-radius: 8px;
    cursor: pointer; color: #666; background: transparent;
    transition: background 0.15s, color 0.15s; letter-spacing: 0.02em;
  }
  .tab-btn:hover { color: #ccc; }
  body.light .tab-btn:hover { color: #333; }
  .tab-btn.active { background: #3a3a3a; color: #f0f0ee; }
  body.light  .tab-btn.active { background: #fff; color: #1a1a1a; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  body.solid  .tab-btn.active { background: #232840; color: #e4e8f4; }
  body.pastel .tab-btn.active { background: #2c2f3e; color: #d4d0e8; }
  .tab-badge {
    display: inline-block; font-size: 10px; font-weight: 600;
    background: #0E9E8E; color: #fff; border-radius: 8px;
    padding: 1px 6px; margin-left: 5px; vertical-align: middle;
  }

  /* Grid */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 420px; }
  .grid-centered { display: flex; flex-wrap: wrap; gap: 14px; width: 100%; max-width: 420px; justify-content: center; }
  .grid-centered .card { width: calc(50% - 7px); min-width: 160px; }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .card {
    background: #2a2a2a; border: 1.5px solid #3a3a3a; border-radius: 20px;
    padding: 1.75rem 1rem 1.25rem;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
    min-height: 150px; position: relative; font-family: inherit; color: #f0f0ee;
    text-decoration: none;
  }
  body.light  .card { background: #fff; border-color: #ddd; color: #1a1a1a; }
  body.solid  .card { background: #1b2035; border-color: #2e3650; color: #e4e8f4; }
  body.pastel .card { background: #232631; border-color: #3c3f52; color: #d4d0e8; }
  .card:hover { transform: scale(1.04); }
  .card:active { transform: scale(0.97); }

  .card-receiving { border-color: #0E9E8E; }
  .card-receiving:hover { background: #0a2e2c; box-shadow: 0 0 0 3px rgba(14,158,142,0.2); }
  .card-recv-live  { border-color: #0E9E8E; }
  .card-recv-live:hover  { background: #0a2e2c; box-shadow: 0 0 0 3px rgba(14,158,142,0.2); }
  .card-itemprep  { border-color: #E67E22; }
  .card-itemprep:hover  { background: #2e1a08; box-shadow: 0 0 0 3px rgba(230,126,34,0.2); }
  .card-ecom      { border-color: #185FA5; }
  .card-ecom:hover      { background: #081a30; box-shadow: 0 0 0 3px rgba(24,95,165,0.2); }
  .card-reserve   { border-color: #9B4DCA; }
  .card-reserve:hover   { background: #1e0a30; box-shadow: 0 0 0 3px rgba(155,77,202,0.2); }
  .card-totes     { border-color: #C87D2B; }
  .card-totes:hover     { background: #2e1a08; box-shadow: 0 0 0 3px rgba(200,125,43,0.2); }
  .card-backlog   { border-color: #185FA5; }
  .card-backlog:hover   { background: #081a30; box-shadow: 0 0 0 3px rgba(24,95,165,0.2); }

  body.light .card-receiving:hover { background: #E6F7F5; }
  body.light .card-recv-live:hover  { background: #E6F7F5; }
  body.light .card-itemprep:hover  { background: #FEF0E0; }
  body.light .card-ecom:hover      { background: #e8f0fb; }
  body.light .card-reserve:hover   { background: #F3E8FF; }
  body.light .card-totes:hover     { background: #FDF3E7; }
  body.light .card-backlog:hover   { background: #e8f0fb; }

  .card-version { position: absolute; top: 10px; right: 13px; font-size: 10px; color: #555; }
  body.light .card-version { color: #aaa; }
  .card-icon { font-size: 40px; margin-bottom: 12px; line-height: 1; }
  .card-name { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
  .card-sub  { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.05em; }
  body.light .card-sub { color: #999; }

  .card-receiving .card-name { color: #0E9E8E; }
  .card-recv-live  .card-name { color: #0E9E8E; }
  .card-itemprep  .card-name { color: #E67E22; }
  .card-ecom      .card-name { color: #5B9BD5; }
  .card-reserve   .card-name { color: #B57FDD; }
  .card-totes     .card-name { color: #C87D2B; }
  .card-backlog   .card-name { color: #5B9BD5; }

  /* Footer */
  .footer { margin-top: 1.75rem; font-size: 11px; color: #555; text-align: center; }
  body.light .footer { color: #aaa; }

  /* Theme picker — bottom right */
  .menu-theme-picker{position:fixed;bottom:20px;right:20px;z-index:100;}
  .menu-theme-btn{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;background:#2a2a2a;border:1.5px solid #3a3a3a;border-radius:22px;padding:8px 16px;font-family:inherit;white-space:nowrap;color:#888;}
  .menu-theme-btn:hover{background:#333;color:#ccc;}
  body.light  .menu-theme-btn{background:#f0f0ee;border-color:#ccc;color:#555;}
  body.solid  .menu-theme-btn{background:#1b2035;border-color:#2e3650;color:#8090b0;}
  body.pastel .menu-theme-btn{background:#232631;border-color:#3c3f52;color:#8b8aaa;}
  .menu-theme-chevron{font-size:10px;opacity:0.6;transition:transform 0.15s;}
  .menu-theme-picker.open .menu-theme-chevron{transform:rotate(180deg);}
  .menu-theme-menu{display:none;position:absolute;bottom:calc(100% + 8px);right:0;background:#2a2a2a;border:1.5px solid #3a3a3a;border-radius:10px;overflow:hidden;min-width:110px;box-shadow:0 -4px 24px rgba(0,0,0,0.4);z-index:200;}
  .menu-theme-picker.open .menu-theme-menu{display:block;}
  body.light  .menu-theme-menu{background:#fff;border-color:#ddd;box-shadow:0 -4px 16px rgba(0,0,0,0.12);}
  body.solid  .menu-theme-menu{background:#1b2035;border-color:#2e3650;}
  body.pastel .menu-theme-menu{background:#232631;border-color:#3c3f52;}
  .menu-theme-option{padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer;color:#888;transition:background 0.1s;}
  .menu-theme-option:hover{background:#333;color:#f0f0ee;}
  body.light  .menu-theme-option:hover{background:#f0f0ee;color:#1a1a1a;}
  body.solid  .menu-theme-option:hover{background:#232840;color:#e4e8f4;}
  body.pastel .menu-theme-option:hover{background:#2c2f3e;color:#d4d0e8;}
  .menu-theme-option.active{color:#0E9E8E;}

  /* Missing files warning */
  .warning {
    display: none; margin-top: 1rem; padding: 10px 16px;
    background: #2e1a08; border: 0.5px solid #E67E22; border-radius: 8px;
    font-size: 12px; color: #E67E22; text-align: center; max-width: 420px;
  }
  body.light .warning { background: #FEF0E0; }
</style>
</head>
<body>

<div class="header">
  <h1>SCOUT</h1>
  <p>Select a department to open its report processor</p>
</div>

<!-- Tab bar -->
<div class="tab-bar">
  <button class="tab-btn active" id="tab-reports" onclick="switchTab('reports')">Reports</button>
  <button class="tab-btn" id="tab-live" onclick="switchTab('live')">Live <span class="tab-badge">3</span></button>
</div>

<!-- Reports tab -->
<div class="tab-panel active" id="panel-reports">
  <div class="grid">
    <button class="card card-receiving" onclick="openApp('Receiving_v2.0.html')">
      <span class="card-version">v2.0</span>
      <div class="card-icon">&#x1F69B;</div>
      <div class="card-name">Receiving</div>
      <div class="card-sub">Inbound</div>
    </button>

    <button class="card card-itemprep" onclick="openApp('ItemPrep_v2.0.html')">
      <span class="card-version">v2.0</span>
      <div class="card-icon">&#x1F9E5;</div>
      <div class="card-name">Item Prep</div>
      <div class="card-sub">Crossdock Pack</div>
    </button>

    <button class="card card-ecom" onclick="openApp('Ecom_v3.html')">
      <span class="card-version">v3.0</span>
      <div class="card-icon">&#x1F4E6;</div>
      <div class="card-name">Ecom</div>
      <div class="card-sub">Replen &middot; Putaway</div>
    </button>

    <button class="card card-reserve" onclick="openApp('Reserve_v1_7.html')">
      <span class="card-version">v1.7</span>
      <div class="card-icon">&#x1F3EA;</div>
      <div class="card-name">Reserve Stock</div>
      <div class="card-sub">Pick F1 &middot; Pick F2 &middot; Replen &middot; Putaway</div>
    </button>
  </div>
</div>

<!-- Live tab -->
<div class="tab-panel" id="panel-live">
  <div class="grid-centered">
    <button class="card card-recv-live" onclick="openApp('Receiving_live.html')">
      <span class="card-version">Live</span>
      <div class="card-icon">&#x1F4E1;</div>
      <div class="card-name">Receiving Live</div>
      <div class="card-sub">Live &middot; 2nd Shift</div>
    </button>

    <button class="card card-totes" onclick="openApp('Totes_live.html')">
      <span class="card-version">v1.5</span>
      <div class="card-icon">&#x1F9FA;</div>
      <div class="card-name">Open Totes</div>
      <div class="card-sub">Live &middot; Ecom</div>
    </button>

    <button class="card card-backlog" onclick="openApp('Backlog_live.html')">
      <span class="card-version">Live</span>
      <div class="card-icon">&#x1F4CB;</div>
      <div class="card-name">Ecom Backlog</div>
      <div class="card-sub">Live &middot; Order Lines</div>
    </button>

    <button class="card" onclick="openApp('Shipping_live.html')" style="border-top-color:#E65100;">
      <span class="card-version">Live</span>
      <div class="card-icon">&#x1F69A;</div>
      <div class="card-name">Shipping</div>
      <div class="card-sub">Live &middot; 2nd Shift</div>
    </button>
  </div>
</div>

<div class="warning" id="warning">
  &#x26A0; Make sure all dept files are in the same folder as this menu file.
</div>

<div class="footer">
  Nordstrom &middot; Menu v1.7 &middot; dean.karim &middot; <span id="date"></span>
  <br><button onclick="toggleWhatsNew()" style="background:none;border:none;color:#555;font-size:11px;cursor:pointer;margin-top:4px;font-family:inherit;text-decoration:underline;">What's new?</button>
</div>

<div id="whats-new-panel" style="display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);width:340px;background:#2a2a2a;border:1px solid #3a3a3a;border-radius:14px;padding:1.25rem;z-index:500;box-shadow:0 8px 32px rgba(0,0,0,0.4);">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
    <div style="font-size:13px;font-weight:600;color:#f0f0ee;">What's New</div>
    <button onclick="toggleWhatsNew()" style="background:none;border:none;color:#666;font-size:18px;cursor:pointer;line-height:1;font-family:inherit;">&times;</button>
  </div>
  <div id="whats-new-content" style="font-size:12px;color:#999;line-height:1.7;">Loading...</div>
</div>

<div class="menu-theme-picker" id="menu-theme-picker">
  <button class="menu-theme-btn" onclick="menuToggleThemeMenu()">
    <span id="menu-theme-label">Dark</span>
    <span class="menu-theme-chevron">&#9660;</span>
  </button>
  <div class="menu-theme-menu" id="menu-theme-menu">
    <div class="menu-theme-option" data-tv="dark"   onclick="menuPickTheme('dark')">Dark</div>
    <div class="menu-theme-option" data-tv="solid"  onclick="menuPickTheme('solid')">Solid</div>
    <div class="menu-theme-option" data-tv="pastel" onclick="menuPickTheme('pastel')">Pastel</div>
    <div class="menu-theme-option" data-tv="light"  onclick="menuPickTheme('light')">Light</div>
  </div>
</div>

<script>
var TAB_KEY   = 'dc499_menu_tab_v1';
var THEME_KEY = 'dc499_theme_v1';
var isDark    = true;

// ── TABS ───────────────────────────────────────────────
function switchTab(name) {
  ['reports','live'].forEach(function(t) {
    document.getElementById('tab-' + t).classList.toggle('active', t === name);
    document.getElementById('panel-' + t).classList.toggle('active', t === name);
  });
  try { localStorage.setItem(TAB_KEY, name); } catch(e) {}
}

// ── OPEN APP ───────────────────────────────────────────
function openApp(filename) {
  var base = window.location.href.replace(/\/[^\/]*$/, '/');
  window.location.href = base + filename;
}

// ── THEME ──────────────────────────────────────────────
var MENU_THEME_VALS  = ['dark','solid','pastel','light'];
var MENU_THEME_NAMES = {dark:'Dark',solid:'Solid',pastel:'Pastel',light:'Light'};
function applyTheme(t) {
  isDark = (t !== 'light');
  document.body.className = (t === 'dark') ? '' : t;
  var lbl = document.getElementById('menu-theme-label');
  if (lbl) lbl.textContent = MENU_THEME_NAMES[t] || t;
  document.querySelectorAll('.menu-theme-option').forEach(function(el){ el.classList.toggle('active', el.getAttribute('data-tv') === t); });
  try { localStorage.setItem(THEME_KEY, t); } catch(e) {}
}
function menuToggleThemeMenu() { document.getElementById('menu-theme-picker').classList.toggle('open'); }
function menuPickTheme(t) { applyTheme(t); document.getElementById('menu-theme-picker').classList.remove('open'); }
document.addEventListener('click', function(e){ var p=document.getElementById('menu-theme-picker'); if(p&&!p.contains(e.target)) p.classList.remove('open'); });

function initTheme() {
  try {
    var saved = localStorage.getItem(THEME_KEY);
    if (saved && MENU_THEME_VALS.indexOf(saved) !== -1) { applyTheme(saved); return; }
    if (saved === 'dark' || saved === 'light') { applyTheme(saved); return; }
  } catch(e) {}
  applyTheme(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}

// ── INIT ───────────────────────────────────────────────
document.getElementById('date').textContent = new Date().toLocaleDateString();
initTheme();
try {
  var savedTab = localStorage.getItem(TAB_KEY);
  if (savedTab === 'live') switchTab('live');
} catch(e) {}

function toggleWhatsNew() {
  var panel = document.getElementById('whats-new-panel');
  var isHidden = panel.style.display === 'none';
  panel.style.display = isHidden ? 'block' : 'none';
  if (isHidden) loadWhatsNew();
}

function loadWhatsNew() {
  var el = document.getElementById('whats-new-content');
  fetch('changelog.json?t=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!data || !data.length) { el.textContent = 'No updates yet.'; return; }
      var release = data[0];
      var html = '<div style="color:#888;margin-bottom:8px;">v' + release.version + ' &middot; ' + formatDate(release.date) + '</div>';
      release.apps.forEach(function(group) {
        html += '<div style="color:#ccc;font-weight:500;margin-bottom:4px;">' + group.app + '</div>';
        group.changes.forEach(function(c) {
          html += '<div style="padding-left:10px;color:#888;">&#x2022; ' + c + '</div>';
        });
        html += '<div style="height:8px;"></div>';
      });
      el.innerHTML = html;
    })
    .catch(function() { el.textContent = 'Could not load updates.'; });
}

function formatDate(iso) {
  try { return new Date(iso + 'T12:00:00').toLocaleDateString([], {year:'numeric',month:'long',day:'numeric'}); }
  catch(e) { return iso; }
}
</script>
</body>
</html>
