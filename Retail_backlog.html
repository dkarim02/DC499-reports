<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retail Backlog Live v1.0 -- DC499</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#f5f5f3;--surface:#fff;--surface2:#efefed;--border:#ddd;--border-light:#f0f0f0;--border-mid:#e5e5e5;
    --text:#1a1a1a;--text-muted:#666;--text-hint:#888;--bar-bg:#e5e5e5;
    --accent:#185FA5;--accent-bg:#e8f0fb;--accent-muted:#91b8e8;
    --ready:#2E7D32;--ready-bg:#E8F5E9;
    --alloc:#E65100;--alloc-bg:#FFF3E0;
    --packing:#6D28D9;--packing-bg:#EDE9FE;
    --packed:#5B9BD5;--packed-bg:#e8f0fb;
    --loaded:#00838F;--loaded-bg:#E0F7FA;
    --green:#2E7D32;--green-bg:#E8F5E9;
    --amber:#E65100;--amber-bg:#FFF3E0;
    --red:#C62828;--red-bg:#FFEBEE;
  }
  [data-theme="dark"]{
    --bg:#1a1a1a;--surface:#252525;--surface2:#2e2e2e;--border:#3a3a3a;--border-light:#2e2e2e;--border-mid:#333;
    --text:#f0f0ee;--text-muted:#999;--text-hint:#777;--bar-bg:#3a3a3a;
    --accent-bg:#0d2340;--accent-muted:#5B9BD5;
    --ready:#4CAF50;--ready-bg:#1a2e1a;
    --alloc:#FFB74D;--alloc-bg:#2e1a00;
    --packing:#a78bfa;--packing-bg:#2e1a50;
    --packed:#5B9BD5;--packed-bg:#0d2340;
    --loaded:#26C6DA;--loaded-bg:#0d2e32;
    --green:#4CAF50;--green-bg:#1a2e1a;
    --amber:#FFB74D;--amber-bg:#2e1a00;
    --red:#EF9A9A;--red-bg:#2e1010;
  }
  [data-theme="solid"]{
    --bg:#13172b;--surface:#1b2035;--surface2:#232840;--border:#2e3650;--border-light:#232840;--border-mid:#3a4360;
    --text:#e4e8f4;--text-muted:#8090b0;--text-hint:#4a5570;--bar-bg:#2e3650;
    --accent-bg:#0d2340;--accent-muted:#5B9BD5;
    --ready:#22c55e;--ready-bg:#052e16;
    --alloc:#FFB74D;--alloc-bg:#2a1f00;
    --packing:#a78bfa;--packing-bg:#1e1040;
    --packed:#5B9BD5;--packed-bg:#0d2340;
    --loaded:#22d3ee;--loaded-bg:#0a2830;
    --green:#22c55e;--green-bg:#052e16;
    --amber:#FFB74D;--amber-bg:#2a1f00;
    --red:#EF9A9A;--red-bg:#2d0a0a;
  }
  [data-theme="pastel"]{
    --bg:#1a1c24;--surface:#232631;--surface2:#2c2f3e;--border:#3c3f52;--border-light:#2c2f3e;--border-mid:#484c60;
    --text:#d4d0e8;--text-muted:#8b8aaa;--text-hint:#565670;--bar-bg:#3c3f52;
    --accent:#7ecec4;--accent-bg:#152e2c;--accent-muted:#7ecec4;
    --ready:#86efac;--ready-bg:#162b22;
    --alloc:#fde68a;--alloc-bg:#2e2410;
    --packing:#c4b5fd;--packing-bg:#1e1840;
    --packed:#7ecec4;--packed-bg:#152e2c;
    --loaded:#67e8f9;--loaded-bg:#0c2830;
    --green:#86efac;--green-bg:#162b22;
    --amber:#fde68a;--amber-bg:#2e2410;
    --red:#fca5a5;--red-bg:#2e1a1a;
  }
  [data-theme="starr"]{
    --bg:#e8a8c8;--surface:#fdf0f8;--surface2:#f5cfe8;--border:#d888b8;--border-light:#f0d8ec;--border-mid:#e8c0d8;
    --text:#1e0a16;--text-muted:#6b2048;--text-hint:#9e5070;--bar-bg:#e8c0d8;
    --accent:#b0003a;--accent-bg:#f8d0e8;--accent-muted:#d06090;
    --ready:#1b5e20;--ready-bg:#f0d8e8;
    --alloc:#8b3000;--alloc-bg:#fad0e0;
    --packing:#6D28D9;--packing-bg:#EDE9FE;
    --packed:#b0003a;--packed-bg:#f8d0e8;
    --loaded:#00838F;--loaded-bg:#d0f0f4;
    --green:#1b5e20;--green-bg:#f0d8e8;
    --amber:#8b3000;--amber-bg:#fad0e0;
    --red:#7b0020;--red-bg:#f8c8d8;
  }
  [data-theme="scout"]{
    --bg:#0c0d14;--surface:#111420;--surface2:#171b2a;--border:#1c2232;--border-light:#141825;--border-mid:#222a3c;
    --text:#e2e8e8;--text-muted:#5a7a78;--text-hint:#2e4a48;
    --bar-bg:#1c2232;
    --accent:#0E9E8E;--accent-bg:#0c2e2b;--accent-muted:#0E9E8E;
    --ready:#27ae60;--ready-bg:#0c2e1a;
    --alloc:#e67e22;--alloc-bg:#2e1a00;
    --packing:#9b59b6;--packing-bg:#1e1040;
    --packed:#2196f3;--packed-bg:#0d2340;
    --loaded:#0E9E8E;--loaded-bg:#0c2e2b;
    --green:#27ae60;--green-bg:#0c2e1a;
    --amber:#e67e22;--amber-bg:#2e1a00;
    --red:#e74c3c;--red-bg:#2d0a0a;
  }
  [data-theme="scout"] body {
    background: radial-gradient(ellipse 70% 55% at 0% 0%, rgba(14,158,142,0.13) 0%, transparent 65%),
                radial-gradient(ellipse 60% 50% at 100% 100%, rgba(24,95,165,0.12) 0%, transparent 65%),
                #0c0d14;
  }
  [data-theme="scout"] .theme-option.active { color: #0E9E8E; }

  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:2rem;transition:background 0.2s,color 0.2s;}
  .container{max-width:1100px;margin:0 auto;}

  /* top bar */
  .top-bar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.5rem;gap:1rem;}
  .top-bar-left{}
  .dept-label{font-size:11px;color:var(--accent);font-weight:500;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:4px;}
  h1{font-size:20px;font-weight:500;margin-bottom:2px;}
  .subtitle{font-size:13px;color:var(--text-muted);}
  .top-bar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}

  /* theme picker */
  .theme-picker{position:relative;}
  .theme-btn{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-muted);cursor:pointer;background:none;border:0.5px solid var(--border);border-radius:8px;padding:6px 12px;font-family:inherit;white-space:nowrap;}
  .theme-btn:hover{background:var(--surface2);}
  .theme-btn-chevron{font-size:10px;opacity:0.6;transition:transform 0.15s;}
  .theme-picker.open .theme-btn-chevron{transform:rotate(180deg);}
  .theme-menu{display:none;position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:0.5px solid var(--border);border-radius:10px;overflow:hidden;min-width:120px;box-shadow:0 8px 24px rgba(0,0,0,0.25);z-index:200;}
  .theme-options-scroll{overflow-y:auto;max-height:200px;}
  .theme-options-scroll::-webkit-scrollbar{width:4px;}.theme-options-scroll::-webkit-scrollbar-track{background:transparent;}.theme-options-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
  .theme-picker.open .theme-menu{display:block;}
  .theme-option{padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text-muted);transition:background 0.1s;}
  .theme-option:hover{background:var(--surface2);color:var(--text);}
  .theme-option.active{color:var(--accent);}

  /* refresh meta */
  .meta-bar{font-size:12px;color:var(--text-hint);margin-bottom:1.5rem;}

  /* wave cards */
  .waves{display:flex;flex-direction:column;gap:1rem;}

  .wave-card{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;overflow:hidden;}
  .wave-card.stale{opacity:0.65;}

  .wave-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:0.5px solid var(--border);gap:1rem;cursor:pointer;user-select:none;}
  .wave-header:hover{background:var(--surface2);}
  .wave-left{display:flex;align-items:center;gap:12px;}
  .wave-date-label{font-size:15px;font-weight:600;color:var(--text);}
  .wave-total{font-size:13px;color:var(--text-muted);}
  .wave-chevron{font-size:11px;color:var(--text-hint);transition:transform 0.2s;}
  .wave-card.expanded .wave-chevron{transform:rotate(180deg);}

  /* status pills row */
  .status-row{display:flex;flex-wrap:wrap;gap:6px;padding:12px 18px;border-bottom:0.5px solid var(--border-light);}
  .status-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:4px 10px;border-radius:20px;white-space:nowrap;}
  .pill-ready   {color:var(--ready);  background:var(--ready-bg);}
  .pill-alloc   {color:var(--alloc);  background:var(--alloc-bg);}
  .pill-packing {color:var(--packing);background:var(--packing-bg);}
  .pill-packed  {color:var(--packed); background:var(--packed-bg);}
  .pill-loaded  {color:var(--loaded); background:var(--loaded-bg);}
  .pill-count{font-weight:700;}

  /* progress bar */
  .progress-section{padding:10px 18px 14px;}
  .progress-label{font-size:11px;color:var(--text-hint);margin-bottom:5px;}
  .progress-track{background:var(--bar-bg);border-radius:4px;height:6px;overflow:hidden;display:flex;}
  .progress-seg{height:100%;transition:width 0.5s;}
  .seg-ready   {background:var(--ready);}
  .seg-alloc   {background:var(--alloc);}
  .seg-packing {background:var(--packing);}
  .seg-packed  {background:var(--packed);}
  .seg-loaded  {background:var(--loaded);}

  /* store breakdown (expanded) */
  .wave-detail{display:none;padding:16px 18px;border-top:0.5px solid var(--border-light);}
  .wave-card.expanded .wave-detail{display:flex;gap:20px;flex-wrap:wrap;}
  .detail-chart{flex:0 0 220px;}
  .detail-chart canvas{width:220px!important;height:220px!important;}
  .detail-stores{flex:1;min-width:200px;}
  .stores-title{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px;}
  .store-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:0.5px solid var(--border-light);font-size:13px;}
  .store-row:last-child{border-bottom:none;}
  .store-id{color:var(--text);font-weight:500;min-width:50px;}
  .store-bar-wrap{flex:1;margin:0 10px;background:var(--bar-bg);border-radius:3px;height:5px;overflow:hidden;}
  .store-bar-fill{height:100%;border-radius:3px;background:var(--accent-muted);transition:width 0.4s;}
  .store-orders{color:var(--text-muted);font-size:12px;min-width:36px;text-align:right;}
  .store-other{font-size:12px;color:var(--text-hint);padding:6px 0 2px;}

  /* empty / error states */
  .empty-state{text-align:center;padding:3rem;color:var(--text-hint);font-size:14px;}

  /* disclaimer */
  .disclaimer{margin-top:2rem;font-size:11px;color:var(--text-hint);text-align:center;line-height:1.5;}

  @keyframes pageEnter{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  body{animation:pageEnter 0.28s ease-out both;}
</style>
</head>
<body>
<div class="container">

  <div class="top-bar">
    <div class="top-bar-left">
      <div class="dept-label">DC499 — Retail</div>
      <h1>Retail Backlog</h1>
      <div class="subtitle" id="subtitle">Loading...</div>
    </div>
    <div class="top-bar-right">
      <div class="theme-picker" id="themePicker">
        <button class="theme-btn" onclick="toggleThemeMenu()">
          <span id="themeLabel">Theme</span>
          <span class="theme-btn-chevron">&#9660;</span>
        </button>
        <div class="theme-menu">
          <div class="theme-options-scroll">
            <div class="theme-option" onclick="setTheme('light')">Light</div>
            <div class="theme-option" onclick="setTheme('dark')">Dark</div>
            <div class="theme-option" onclick="setTheme('solid')">Solid</div>
            <div class="theme-option" onclick="setTheme('pastel')">Pastel</div>
            <div class="theme-option" onclick="setTheme('starr')">Starr</div>
            <div class="theme-option" onclick="setTheme('scout')">Scout</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="meta-bar" id="metaBar"></div>
  <div class="waves" id="wavesContainer">
    <div class="empty-state">Loading wave data...</div>
  </div>

  <div class="disclaimer">Disclaimer: This tool measures throughput only and may not be used to evaluate, coach, or hold team members accountable on performance.</div>
</div>

<script>
// ── theme ──────────────────────────────────────────────────────────────────────
const THEME_KEY = 'retail_backlog_theme_v1';
const THEME_NAMES = { light:'Light', dark:'Dark', solid:'Solid', pastel:'Pastel', starr:'Starr', scout:'Scout' };

function applyTheme(t) {
  const entering = document.body.classList.contains('is-entering');
  const exiting  = document.body.classList.contains('is-exiting');
  document.documentElement.setAttribute('data-theme', t === 'light' ? '' : t);
  document.body.className = '';
  if (entering) document.body.classList.add('is-entering');
  if (exiting)  document.body.classList.add('is-exiting');
  document.getElementById('themeLabel').textContent = THEME_NAMES[t] || 'Theme';
  document.querySelectorAll('.theme-option').forEach(el => {
    el.classList.toggle('active', el.textContent.toLowerCase() === t);
  });
}
function setTheme(t) {
  localStorage.setItem(THEME_KEY, t);
  applyTheme(t);
  closeThemeMenu();
  redrawCharts();
}
function toggleThemeMenu() {
  document.getElementById('themePicker').classList.toggle('open');
}
function closeThemeMenu() {
  document.getElementById('themePicker').classList.remove('open');
}
document.addEventListener('click', e => {
  if (!document.getElementById('themePicker').contains(e.target)) closeThemeMenu();
});
applyTheme(localStorage.getItem(THEME_KEY) || 'dark');

// ── status config ──────────────────────────────────────────────────────────────
const STATUS_ORDER  = ['1000','2090','7100','7200','7800'];
const STATUS_LABELS = { '1000':'Ready', '2090':'Allocated', '7100':'Packing', '7200':'Packed', '7800':'Loaded' };
const STATUS_CLASS  = { '1000':'ready', '2090':'alloc', '7100':'packing', '7200':'packed', '7800':'loaded' };
const STATUS_COLORS_LIGHT = {
  '1000': '#2E7D32', '2090': '#E65100', '7100': '#6D28D9', '7200': '#5B9BD5', '7800': '#00838F'
};
const STATUS_COLORS_DARK = {
  '1000': '#4CAF50', '2090': '#FFB74D', '7100': '#a78bfa', '7200': '#5B9BD5', '7800': '#26C6DA'
};

function statusColor(code) {
  const dark = ['dark','solid','pastel','scout'].includes(localStorage.getItem(THEME_KEY) || 'dark');
  return (dark ? STATUS_COLORS_DARK : STATUS_COLORS_LIGHT)[code] || '#999';
}

// ── chart registry (for redraw on theme change) ────────────────────────────────
const chartRegistry = {};

function buildPieData(stores, totalActive) {
  const TOP = 5;
  const top = stores.slice(0, TOP);
  const otherOrders = stores.slice(TOP).reduce((s, r) => s + r.orders, 0);
  const labels = top.map(r => `Store ${r.store_id}`);
  const data   = top.map(r => r.orders);
  const palette = ['#5B9BD5','#E65100','#2E7D32','#6D28D9','#00838F'];
  const colors  = top.map((_, i) => palette[i]);
  if (otherOrders > 0) { labels.push('Other'); data.push(otherOrders); colors.push('#aaa'); }
  return { labels, data, colors };
}

function renderPie(canvasId, stores) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  if (chartRegistry[canvasId]) { chartRegistry[canvasId].destroy(); delete chartRegistry[canvasId]; }
  const { labels, data, colors } = buildPieData(stores);
  const isDark = ['dark','solid','pastel','scout'].includes(localStorage.getItem(THEME_KEY) || 'dark');
  chartRegistry[canvasId] = new Chart(canvas, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 1, borderColor: isDark ? '#333' : '#fff' }] },
    options: {
      cutout: '55%',
      plugins: {
        legend: { display: true, position: 'bottom', labels: { color: isDark ? '#999' : '#666', font: { size: 11 }, boxWidth: 10, padding: 8 } },
        tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed} orders` } },
      },
      animation: { duration: 400 },
    },
  });
}

function redrawCharts() {
  Object.keys(chartRegistry).forEach(id => {
    const canvas = document.getElementById(id);
    if (!canvas) return;
    const stores = canvas.dataset.stores ? JSON.parse(canvas.dataset.stores) : [];
    renderPie(id, stores);
  });
}

// ── render ─────────────────────────────────────────────────────────────────────
function fmtDate(isoDate) {
  const [y, m, d] = isoDate.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function renderWaves(data) {
  const container = document.getElementById('wavesContainer');
  if (!data.waves || !data.waves.length) {
    container.innerHTML = '<div class="empty-state">No active waves found.</div>';
    return;
  }

  container.innerHTML = '';
  data.waves.forEach((wave, idx) => {
    const total = wave.total_active_orders || 0;
    const sc    = wave.status_counts || {};
    const isStale = total < 5;

    // status pills
    const pillsHtml = STATUS_ORDER.filter(s => sc[s]).map(s =>
      `<span class="status-pill pill-${STATUS_CLASS[s]}">
        <span>${STATUS_LABELS[s]}</span>
        <span class="pill-count">${sc[s].toLocaleString()}</span>
      </span>`
    ).join('');

    // segmented progress bar
    const segsHtml = STATUS_ORDER.filter(s => sc[s] && total > 0).map(s => {
      const pct = (sc[s] / total * 100).toFixed(1);
      return `<div class="progress-seg seg-${STATUS_CLASS[s]}" style="width:${pct}%"></div>`;
    }).join('');

    // store list (all stores)
    const maxOrders = wave.stores.length ? wave.stores[0].orders : 1;
    const storeRowsHtml = wave.stores.map(r =>
      `<div class="store-row">
        <span class="store-id">${r.store_id}</span>
        <div class="store-bar-wrap"><div class="store-bar-fill" style="width:${(r.orders/maxOrders*100).toFixed(1)}%"></div></div>
        <span class="store-orders">${r.orders}</span>
      </div>`
    ).join('');

    const canvasId = `pie-${idx}`;

    const card = document.createElement('div');
    card.className = `wave-card${isStale ? ' stale' : ''}`;
    card.innerHTML = `
      <div class="wave-header" onclick="toggleWave(this)">
        <div class="wave-left">
          <span class="wave-date-label">${fmtDate(wave.wave_date)}</span>
          <span class="wave-total">${total.toLocaleString()} active order${total !== 1 ? 's' : ''}</span>
          ${isStale ? '<span class="status-pill pill-packed" style="font-size:11px;padding:2px 8px;">nearly done</span>' : ''}
        </div>
        <span class="wave-chevron">&#9660;</span>
      </div>
      <div class="status-row">${pillsHtml || '<span style="font-size:12px;color:var(--text-hint)">No active orders</span>'}</div>
      <div class="progress-section">
        <div class="progress-label">Active order distribution</div>
        <div class="progress-track">${segsHtml}</div>
      </div>
      <div class="wave-detail">
        <div class="detail-chart">
          <canvas id="${canvasId}" data-stores='${JSON.stringify(wave.stores)}'></canvas>
        </div>
        <div class="detail-stores">
          <div class="stores-title">All Stores (${wave.stores.length})</div>
          ${storeRowsHtml}
        </div>
      </div>
    `;
    container.appendChild(card);

    // auto-expand the first (most active) wave
    if (idx === 0) {
      card.classList.add('expanded');
      setTimeout(() => renderPie(canvasId, wave.stores), 50);
    }
  });
}

function toggleWave(header) {
  const card = header.closest('.wave-card');
  const wasExpanded = card.classList.contains('expanded');
  card.classList.toggle('expanded');
  if (!wasExpanded) {
    const canvas = card.querySelector('canvas');
    if (canvas) {
      const stores = JSON.parse(canvas.dataset.stores || '[]');
      renderPie(canvas.id, stores);
    }
  }
}

// ── data fetch ─────────────────────────────────────────────────────────────────
function getLiveBase() {
  const onLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  return onLocal ? 'http://localhost:3001' : 'https://dkarim02.github.io/DC499-reports';
}

async function loadData() {
  try {
    const url = `${getLiveBase()}/retail_backlog_live.json?_=${Date.now()}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    const genDt = new Date(data.generated);
    const pdt   = genDt.toLocaleTimeString('en-US', { timeZone: 'America/Los_Angeles', hour12: true, hour:'numeric', minute:'2-digit' });
    document.getElementById('metaBar').textContent = `Last updated ${pdt} PDT`;

    const totalActive = (data.waves || []).reduce((s, w) => s + (w.total_active_orders || 0), 0);
    const waveCount   = (data.waves || []).length;
    document.getElementById('subtitle').textContent =
      `${totalActive.toLocaleString()} active orders across ${waveCount} wave${waveCount !== 1 ? 's' : ''}`;

    renderWaves(data);
  } catch (e) {
    document.getElementById('wavesContainer').innerHTML =
      `<div class="empty-state">Could not load data — ${e.message}</div>`;
    document.getElementById('subtitle').textContent = 'Data unavailable';
  }
}

loadData();
setInterval(loadData, 5 * 60 * 1000);
</script>
</body>
</html>
